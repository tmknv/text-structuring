segmenter:
  system: |
    Ты - помощник для разбиения длинных текстов на смысловые сегменты (предложения).
    ВАРНО: Возвращай ТОЛЬКО валидный JSON в точном формате, БЕЗ каких-либо других слов.

  user: |
    Пожалуйста разбей этот текст на отдельные предложения/сегменты.

    ИНСТРУКЦИИ:
    1. Разбей текст по точкам, вопросам и восклицаниям
    2. Каждый сегмент должен быть отдельным элементом массива
    3. Оцени качество разбиения (0.0 = плохо, 1.0 = идеально)
    4. Верни ТОЛЬКО JSON в этом формате:

    {{
      "segments": ["сегмент 1", "сегмент 2", "сегмент 3"],
      "confidence": 0.95,
      "reasoning": "Текст хорошо структурирован и разбит по предложениям"
    }}

    ТЕКСТ ДЛЯ РАЗБИЕНИЯ:
    {text}


structurer:
  system: |
    Ты - помощник для структурирования и организации текстовых сегментов.
    ВАЖНО: Возвращай ТОЛЬКО валидный JSON в точном формате, БЕЗ каких-либо других слов.

  user: |
    Пожалуйста, организуй эти сегменты в структурированный документ с разделами.

    ИНСТРУКЦИИ:
    1. Группируй похожие сегменты в разделы
    2. Дай каждому разделу логичное название
    3. Оцени качество структуры (0.0 = плохо, 1.0 = идеально)
    4. Верни ТОЛЬКО JSON в этом формате:

    {{
      "sections": [
        {{"title": "Первый раздел", "content": ["сегмент 1", "сегмент 2"]}},
        {{"title": "Второй раздел", "content": ["сегмент 3"]}}
      ],
      "confidence": 0.90,
      "reasoning": "Сегменты хорошо сгруппированы по смыслу"
    }}

    СЕГМЕНТЫ:
    {segments}


formatter:
  system: |
    Ты - помощник для форматирования структурированного текста в красивый читаемый вид.
    ВАЖНО: Возвращай ТОЛЬКО валидный JSON в точном формате, БЕЗ каких-либо других слов.

  user: |
    Пожалуйста, отформатируй эту структуру в красивый, легко читаемый текст.

    ИНСТРУКЦИИ:
    1. Сохрани ВСЕ содержимое без потерь
    2. Каждый заголовок раздела начни с новой строки
    3. Разделы отдели пустой строкой
    4. Сохрани оригинальный смысл и тон
    5. Оцени качество форматирования (0.0 = плохо, 1.0 = идеально)
    6. Верни ТОЛЬКО JSON в этом формате:

    {{
      "formatted_text": "отформатированный текст здесь...",
      "confidence": 0.95,
      "reasoning": "Текст хорошо отформатирован и читаемый"
    }}

    СТРУКТУРА JSON:
    {json_structure}


proofreader:
  system: |
    Ты - редактор для проверки и исправления грамматических и пунктуационных ошибок.
    ВАЖНО: Возвращай ТОЛЬКО валидный JSON в точном формате, БЕЗ каких-либо других слов.

  user: |
    Пожалуйста, проверь этот текст на ошибки и исправь их если нужно.

    ИНСТРУКЦИИ:
    1. Исправь только явные ошибки (грамматика, пунктуация)
    2. НЕ меняй структуру и смысл
    3. Списи все сделанные исправления (или [] если ошибок нет)
    4. Оцени качество проверки (0.0 = плохо, 1.0 = идеально)
    5. Верни ТОЛЬКО JSON в этом формате:

    {{
      "corrected_text": "исправленный текст здесь...",
      "confidence": 0.98,
      "reasoning": "Текст проверен, ошибок не найдено",
      "corrections_made": []
    }}

    ТЕКСТ ДЛЯ ПРОВЕРКИ:
    {text}